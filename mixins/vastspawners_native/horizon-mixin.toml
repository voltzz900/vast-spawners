[mod]
id = "vastspawners_native"
version = "0.2.0"
priority = 100

# The commit it is built for: besides the native hook points it hooks the spawner's own tick.
[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

# The modifiers and the spawner's data, as `horizon_world::vastspawners` (no game here; tested on its own).
[[module]]
id = "logic"
file = "crates/horizon-world/src/lib.rs"
name = "vastspawners"
source = "logic.rs"
visibility = "pub"

# Keeps the Jade integration in the build only when Jade is in it (a proc macro that reads the staged game.rs).
[[crate]]
id = "optional"
path = "optional"

# The game's side.
[[module]]
id = "client"
file = "crates/horizon-client/src/game.rs"
name = "vastspawners_client"
source = "client.rs"

# A modifier used on a spawner (before the item's own use).
[[injection]]
id = "use-item-on"
hook = "use_item_on"
hook_version = 1
kind = "HEAD"
helper = "use_item_on.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

# The spawner's tick: the range it looks for a player in, as it reads it.
[[injection]]
id = "spawner-range"
target = "horizon_client::game::spawner::Game<'_>::server_tick_spawner_of"
kind = "MODIFY_VARIABLE"
variable = { name = "range", ordinal = 0, at = "STORE" }
require = 1
ordinal = 0
helper = "spawner_range.rs"
bindings = [
  { name = "range", ty = "f64", value = "$value" },
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "(i32, i32, i32)", value = "key" },
  { name = "spawner", ty = "&horizon_client::mobs::spawner::Spawner", value = "&*spawner" },
]

[[injection]]
id = "destroy-block"
hook = "destroy_block"
hook_version = 1
kind = "HEAD"
helper = "destroy_block.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
]

[[injection]]
id = "loot-drops"
hook = "loot_drops"
hook_version = 1
kind = "HEAD"
helper = "loot_drops.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "context", ty = "&horizon_client::mod_api::NativeLootDrops<'_>", value = "context" },
  { name = "drops", ty = "&mut Vec<ItemStack>", value = "&mut *drops" },
]

[[injection]]
id = "place-block"
hook = "place_block"
hook_version = 1
kind = "HEAD"
helper = "place_block.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
]

[[injection]]
id = "server-tick"
hook = "server_tick"
hook_version = 1
kind = "HEAD"
helper = "server_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "tooltip"
hook = "tooltip"
hook_version = 1
kind = "HEAD"
helper = "tooltip.rs"
bindings = [
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "lines", ty = "&mut Vec<(horizon_client::text::Text, u32)>", value = "&mut *lines" },
]

# Once a frame (the client's): Jade's and JEI's plugins added as the game starts.
[[injection]]
id = "frame"
hook = "frame"
hook_version = 1
kind = "HEAD"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "list"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]
